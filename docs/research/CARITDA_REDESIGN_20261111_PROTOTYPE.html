*{box-sizing:border-box}body{margin:0;background:#e8edf1;color:#152c3b;font-family:system-ui,'Malgun Gothic',sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}.lab{max-width:1248px;margin:28px auto;padding:0 20px}.lab h1{font-size:26px;margin:0 0 4px;letter-spacing:-.04em}.note{font-size:14px;color:#445b6b;margin:4px 0 18px}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:16px 0}.tools label{display:grid;gap:4px;font-size:13px;font-weight:650}.tools select,.tools button{min-height:44px;border:1px solid #728695;background:#fff;border-radius:8px;padding:8px 12px;color:#152c3b}.tools button[aria-pressed=true]{background:#153d4b;color:#fff}.stage{container-type:inline-size;margin:22px auto;width:100%;max-width:1160px}.stage.phone{max-width:390px}.app{--bg:#f4f7f9;--surface:#fff;--ink:#142d3d;--muted:#4e6473;--line:#c0ccd4;--control:#718492;--accent:#12596a;--accentInk:#fff;--tint:#e0eff0;--warning:#805000;--warnBg:#fff2d5;--s:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:680px;font-size:calc(20px * var(--s));position:relative}.app.dark{--bg:#101d27;--surface:#192c39;--ink:#f1f6f9;--muted:#bacbd6;--line:#506776;--control:#8299a8;--accent:#9be4d5;--accentInk:#102c2b;--tint:#203f43;--warning:#ffda8c;--warnBg:#44351e}.app.a{--accent:#263e4f;--tint:var(--surface);border-radius:6px}.app.a.dark{--accent:#d6e5f0;--accentInk:#152b3a}.app.large{--s:1.5}.app header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:24px 32px;border-bottom:1px solid var(--line);min-height:100px;background:var(--surface);flex-wrap:wrap}.wordmark{font-size:calc(22px * var(--s));letter-spacing:.08em;font-weight:800}.wordmark span{display:block;font-size:calc(14px * var(--s));letter-spacing:0;font-weight:500;color:var(--muted)}.bar-title{font-weight:700;flex:1}.app button{border:1.5px solid var(--control);border-radius:12px;padding:13px 20px;min-height:64px;background:var(--surface);color:var(--ink);font-weight:650;line-height:1.4;white-space:normal}.app button:hover{border-color:var(--accent)}.app button:focus-visible,.app input:focus-visible,.app textarea:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.app button.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}.app button.quiet{background:transparent}.app button.danger{color:var(--warning)}.app button.small{font-size:calc(17px * var(--s))}.app.a button{border-radius:6px}.content{padding:30px 32px 36px}.eyebrow{font-size:calc(16px * var(--s));color:var(--muted);font-weight:600;margin:0 0 8px}.app h2{font-size:calc(32px * var(--s));letter-spacing:-.045em;line-height:1.25;margin:0 0 14px}.app h3{font-size:calc(23px * var(--s));line-height:1.35;letter-spacing:-.025em;margin:0 0 10px}.app p{margin:8px 0}.muted{color:var(--muted);font-size:calc(17px * var(--s))}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}.stack{display:grid;gap:20px}.card{background:var(--surface);padding:24px;border:1px solid var(--line);border-radius:18px;min-width:0}.app.a .card{border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0;background:transparent}.priority{border-left:5px solid var(--accent)}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.actions>*{flex:1 1 180px}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;font-size:calc(15px * var(--s));padding:4px 9px;font-weight:700}.badge.warn{background:var(--warnBg);color:var(--warning);border-color:var(--warning)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.value{font-size:calc(38px * var(--s));letter-spacing:-.04em;font-weight:700;line-height:1.2}.value small{font-size:calc(18px * var(--s));letter-spacing:0}.metric .muted{font-size:calc(15px * var(--s))}.summary{background:var(--tint);padding:16px 20px;border-radius:12px;margin:18px 0}.feedback{padding:14px 22px;background:var(--tint);border-bottom:1px solid var(--line);font-weight:650}.app input,.app textarea,.app select{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--control);border-radius:9px;min-height:64px;padding:14px;line-height:1.5}.app textarea{min-height:142px;resize:vertical}.field{display:grid;gap:8px;margin:22px 0}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.filters button{font-size:calc(17px * var(--s));min-height:60px}.filters button.on{background:var(--tint);border:2px solid var(--accent)}details{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;min-height:60px;padding:12px 0;font-weight:650}.app ul{padding-left:24px}.app li{margin:10px 0}.app svg{width:28px;height:28px;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}.heading-icon{display:flex;gap:10px;align-items:center}.rule{height:1px;background:var(--line);margin:22px 0}.modal{position:absolute;inset:0;background:#091924b8;display:flex;align-items:center;justify-content:center;padding:22px;z-index:2}.modal .card{max-width:660px;width:100%;background:var(--surface);padding:28px;border-radius:16px}.demo-foot{max-width:1160px;margin:18px auto;color:#445b6b;font-size:14px}.app footer{padding:16px 32px;border-top:1px solid var(--line);font-size:calc(14px * var(--s));color:var(--muted)}.app .error{color:var(--warning);font-weight:700}.kicker{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px;flex-wrap:wrap}

</style></head><body><main class="lab"><h1>카잇다 · 다음 운전자까지 이어지는 차량 기록</h1><p class="note">독립 디자인 프로토타입 · 모든 수치·이름·기록은 가상 예시입니다. 실제 SDK·Gemini·음성·DB·계정·동기화에 연결되지 않습니다.</p><div class="tools" aria-label="시안 검토 도구"><label>디자인<select id="design"><option value="b">B · 브랜드 완성형 (추천)</option><option value="a">A · 실용 최소형</option></select></label><label>앱 창 크기<select id="size"><option value="car">차량 가로 창</option><option value="phone">스마트폰 세로 시안</option></select></label><label>테마<select id="theme"><option value="dark">다크</option><option value="light">라이트</option></select></label><label>글자<select id="font"><option value="normal">기본</option><option value="large">150% 예시</option></select></label><label>예외 상태<select id="scenario"><option value="normal">정차 · 예시 데이터</option><option value="empty">기록 없음</option><option value="offline">AI 연결 끊김</option><option value="error">저장 실패</option><option value="driving">주행 중 제한</option><option value="unknown">안전 상태 미확인</option></select></label><button id="reset">시안 초기화</button></div><div class="stage" id="stage"><section id="app" class="app b dark" aria-label="CARITDA 앱 창 시안"></section></div><p class="demo-foot">차량 OS의 상태 표시줄·드라이빙뷰·공조·GNB는 그리지 않았습니다. 위 앱 창 안에서만 배치합니다. 스마트폰 선택은 레이아웃 시안이며 설치 가능한 Android 앱이 아닙니다.</p></main><script>
'use strict';
const app=document.getElementById('app'); const state={page:'home',previous:'home',history:[],aiIssue:null,design:'b',size:'car',theme:'dark',font:'normal',scenario:'normal',driver:'민수',draft:'',category:'소리',saved:false,ack:[],ai:false,playing:false,feedback:'',modal:null,filter:'전체',query:''};
const icons={health:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',record:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/>',handover:'<path d="M3 8h15m-4-4 4 4-4 4M21 17H6m4-4-4 4 4 4"/>',plus:'<path d="M12 4v16M4 12h16"/>'};
const icon=k=>'<svg aria-hidden="true" viewBox="0 0 24 24">'+icons[k]+'</svg>';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,route,cls='')=>'<button class="'+cls+'" data-route="'+route+'">'+text+'</button>';const act=(text,key,cls='')=>'<button class="'+cls+'" data-act="'+key+'">'+text+'</button>';const badge=(t,w=false)=>'<span class="badge '+(w?'warn':'')+'">'+t+'</span>';
const records=()=>state.scenario==='empty'?[]:[{id:1,title:'브레이크를 밟을 때 소리가 나요',by:'지연',when:'오늘 09:10',status:'점검 전'},{id:2,title:'주차 뒤 바닥에 물기가 있어요',by:'민수',when:'어제 18:20',status:'점검 중'}].concat(state.saved?[{id:3,title:state.draft||'새로 남긴 문제',by:state.driver,when:'방금',status:'점검 전'}]:[]);const pending=()=>records().filter(r=>!state.ack.includes(r.id)&&r.by!==state.driver);let selected=1;
function navigate(p){if(state.page==='record'&&state.draft&&!state.saved&&p!=='record'){state.modal={kind:'draft',to:p};render();return}state.previous=state.page;if(p==='home')state.history=[];else state.history.push(state.page);state.page=p;state.feedback='';state.playing=false;render()}
function head(){if(state.page==='home')return '<header><div class="wordmark">CARITDA<span>차량 기록을 잇다</span></div>'+btn('설정·도움말','settings','quiet small')+'</header>';return '<header>'+act('‹ 이전','back','quiet small')+'<div class="bar-title">'+({health:'차량 건강 상태',records:'기록·인계',record:'문제 남기기',detail:'문제 기록',ai:'AI 문제 설명',handover:'운전자 인계',settings:'설정·도움말',help:'사용법'}[state.page]||'카잇다')+'</div>'+btn('홈','home','quiet small')+'</header>'}
function home(){let n=pending().length;return '<div class="kicker"><p class="eyebrow">나의 차량 · 예시</p>'+act('기록 운전자 · '+esc(state.driver)+'  변경','driver','quiet small')+'</div><div class="layout"><div class="stack"><section class="card priority"><p class="eyebrow">지금 확인할 내용</p><h2>'+(n?'이전 운전자가<br>전할 내용이 있어요':'확인할 인계가 없어요')+'</h2><p>'+(n?esc(pending()[0].title):'새 문제가 생기면 기록을 남겨 주세요.')+'</p><p class="muted">'+(n?'미확인 '+n+'건 · 읽음 확인은 점검 완료가 아니에요.':'기록이 없어도 차량이 정상이라는 뜻은 아니에요.')+'</p><div class="actions">'+(n?btn('인계 확인하기 · '+n+'건','handover','primary'):btn('문제 남기기','record','primary'))+'</div></section>'+(n?'<section class="card"><h3 class="heading-icon">'+icon('plus')+'새 문제가 생겼나요?</h3><p class="muted">말하거나 직접 적은 뒤 저장할 수 있어요.</p><div class="actions">'+btn('문제 남기기','record')+'</div></section>':'')+'</div><div class="stack"><section class="card"><div class="row"><h3 class="heading-icon">'+icon('health')+'차량 건강 상태</h3>'+badge('일부 정보')+'</div><div class="metrics"><div class="metric"><p class="eyebrow">충전량 · 예시</p><div class="value">48 <small>%</small></div><p class="muted">오늘 09:42 조회</p></div><div class="metric"><p class="eyebrow">누적 거리 · 예시</p><div class="value">24,816 <small>km</small></div><p class="muted">오늘 09:42 조회</p></div></div><p class="muted">일부 정보만 확인했어요. 차량 전체 진단이 아니에요.</p><div class="actions">'+btn('차량 상태 보기','health')+'</div></section><section class="card"><h3 class="heading-icon">'+icon('record')+'기록·인계</h3><p class="muted">저장한 문제와 점검 이력을 모아 봅니다.</p><div class="actions">'+btn('기록 전체 보기','records')+'</div></section></div></div>'}
function health(){return '<p class="eyebrow">앱이 확인한 일부 정보 · 가상 예시</p><h2>숫자보다 확인 시각을 함께 봐 주세요.</h2><div class="layout"><section class="card"><h3>차량에서 받은 정보</h3><div class="metrics"><div><p>충전량</p><div class="value">48 <small>%</small></div></div><div><p>누적 거리</p><div class="value">24,816 <small>km</small></div></div></div><p class="muted">오늘 09:42 앱 조회 · 실제 차량 연결 없음</p>'+badge('연료 잔량 · 지원되지 않음')+'<details><summary>출처·수신 상태 자세히</summary><p>이 프로토타입의 값은 가상 예시입니다. 실제 앱에서는 최신 시도와 이전 유효값, 수신 시각과 조회 시각을 구분합니다.</p></details></section><div class="stack"><section class="card"><h3>확인할 변화</h3><p>충전량 안내와 차량 데이터 분석은 여기서 확인합니다.</p><p class="muted">자동 고장 판정이나 수리 완료 판단은 하지 않아요.</p>'+act('충전량 안내·분석 살펴보기','healthInfo')+'</section><section class="card"><h3>운전자 지원</h3><p class="muted">DriveCheck 관련 보조 기능은 핵심 기록을 가리지 않는 이 영역에 둡니다.</p><details><summary>지원 범위 확인</summary><p>이 시안은 위치·길 안내·실시간 감시 기능을 실행하지 않습니다. 실제 지원 범위와 권한은 앱에서 별도로 안내해야 합니다.</p></details></section></div></div>'}
function form(){return '<p class="eyebrow">기록 운전자 · '+esc(state.driver)+'</p><h2>어떤 문제가 있었나요?</h2><div class="layout"><section><label class="field">문제 종류<select id="category">'+['소리','떨림','경고 표시','기타'].map(v=>'<option '+(state.category===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="field">상황 <span class="muted">어떤 때, 무엇이 달랐는지 적어 주세요.</span><textarea id="situation" placeholder="예: 브레이크를 밟으면 끼익 소리가 나요.">'+esc(state.saved?'':state.draft)+'</textarea></label>'+act('음성 입력 예시','voice')+'<p class="muted">실제 앱은 음성 입력이 자동 종료된 뒤 확인·수정합니다.</p><details><summary>선택 정보 추가</summary><p class="muted">발견 시각·메모·당시 차량 정보 연결을 여기에 둡니다. 이 시안에서는 추가 입력을 저장하지 않습니다.</p></details></section><section class="card"><h3>먼저 기록을 저장해요.</h3><p>AI 설명을 보려면 저장한 뒤 전송 내용을 확인해 주세요.</p><p class="muted">음성 입력만으로 기록이 저장되거나 외부로 전송되지 않아요.</p><div class="actions">'+act('저장','save','primary')+act('저장하고 AI 설명','saveAi')+'</div><div class="actions">'+act('작성 취소','cancel','quiet')+'</div></section></div>'}
function list(){let rows=records().filter(r=>(state.filter!=='내 작성'||r.by===state.driver)&&(state.filter!=='완료')&&r.title.includes(state.query));return '<div class="row"><h2>기록·인계</h2>'+btn('문제 남기기','record','primary')+'</div><div class="actions">'+btn('다음 운전자 인계','handover')+'</div><label class="field">기록 찾기<input id="query" value="'+esc(state.query)+'" placeholder="단어나 상황으로 찾기"></label><div class="filters">'+['전체','관리 중','완료','내 작성'].map(f=>'<button data-filter="'+f+'" class="'+(f===state.filter?'on':'')+'" aria-pressed="'+(f===state.filter)+'">'+f+'</button>').join('')+'</div><p class="muted">'+rows.length+'건'+(state.query?' · 검색: '+esc(state.query):'')+'</p><div class="stack">'+(rows.length?rows.map(r=>'<article class="card"><div class="row">'+badge(r.status)+'<span class="muted">'+r.by+' · '+r.when+'</span></div><h3 style="margin-top:14px">'+esc(r.title)+'</h3><div class="actions"><button data-detail="'+r.id+'">기록 자세히 보기</button></div></article>').join(''):'<section class="card"><h3>'+(records().length?'조건에 맞는 기록이 없어요.':'아직 기록이 없어요.')+'</h3>'+act('검색·필터 초기화','clear')+'</section>')+'</div>'}
function detail(){let r=records().find(r=>r.id===selected)||{id:3,title:state.draft||'새로 남긴 문제',by:state.driver,when:'방금',status:'점검 전'};return '<p class="eyebrow">'+esc(r.by)+' · '+r.when+'</p><h2>'+esc(r.title)+'</h2>'+badge(r.status)+'<div class="layout" style="margin-top:24px"><section class="card"><h3>운전자가 남긴 내용</h3><p>'+esc(r.title)+'</p><p class="muted">발견 시각과 작성 이력은 원문과 함께 보존합니다.</p><details><summary>점검·수정·인계 이력</summary><p>가상 예시: 오늘 09:10 문제 기록. 이력은 삭제하거나 AI 응답으로 바꾸지 않습니다.</p></details><div class="actions">'+act('점검 내용 남기기','manual')+act('상태 변경','status')+'</div>'+(r.by===state.driver?'<details><summary>기록 관리</summary>'+act('내용 수정','edit')+' '+act('기록 삭제','delete','danger')+'</details>':'')+'</section><div class="stack"><section class="card"><h3>AI 문제 설명</h3><p class="muted">가능한 원인과 점검 질문을 참고해요. 고장 확정은 아니에요.</p><div class="actions">'+btn((state.aiIssue===selected)?'저장된 AI 설명 보기':'AI 설명 보기','ai','primary')+'</div></section><section class="card"><h3>다음 운전자에게</h3><p>읽음과 점검 상태는 별개로 남습니다.</p><div class="actions">'+(state.ack.includes(r.id)?'<p>현재 운전자가 확인했어요.</p>':act('인계 내용 확인했어요','ack'))+'</div></section></div></div>'}
function ai(){return '<p class="eyebrow">저장된 문제에 연결된 설명 · 가상 예시</p><h2>원인을 단정하지 않고,<br>다음 점검을 도와드려요.</h2><div class="layout"><section class="card"><h3>이번에 보낼 내용</h3><p>'+esc((records().find(r=>r.id===selected)||{}).title||state.draft||'브레이크를 밟을 때 소리가 나요')+'</p><p class="muted">문제 종류·상황만 보냅니다. 이름·메모·위치·차량 수치는 보내지 않아요.</p><details><summary>전송 사본·개인정보·동의 확인</summary><p>실제 앱의 기존 로그인·기기 등록·동의·할당량을 유지합니다. 원문이 아닌 전송 사본을 수정합니다. 이 시안은 어떤 정보도 보내지 않습니다.</p></details><div class="actions">'+act((state.aiIssue===selected)?'새 설명 생성 예시':'새로 설명 생성 예시','generate','primary')+'</div>'+(state.scenario==='offline'?'<p class="error">연결할 수 없어요. 기록은 저장되어 있어요. 연결 후 다시 시도해 주세요.</p>':'')+'</section><section class="card"><h3>'+((state.aiIssue===selected)?'가능한 원인과 확인할 점':'설명을 생성하기 전이에요.')+'</h3>'+((state.aiIssue===selected)?'<p>가상 예시: 증상에는 여러 원인이 있을 수 있어요. 소리가 나는 조건을 기억해 두고 정비소에 점검을 요청해 주세요.</p><p class="muted">시안용 작성 문구 · 실제 Gemini 응답 아님</p><div class="actions">'+act(state.playing?'음성 중단':'이 설명 음성으로 듣기 · 예시','listen')+'</div><p class="muted">음성 동작 표시만 바뀝니다. 실제 소리는 재생하지 않습니다.</p>':'<p class="muted">기록은 이미 저장됐어요. AI 실패가 기록 저장을 취소하지 않아요.</p>')+'</section></div>'}
function handover(){let rows=pending();return '<p class="eyebrow">기록 운전자 · '+state.driver+'</p><h2>다음 운전 전에 확인해 주세요.</h2><p class="muted">현재 운전자가 아직 확인하지 않은 다른 운전자의 기록입니다.</p><div class="stack" style="margin-top:24px">'+(rows.length?rows.map(r=>'<section class="card"><div class="row">'+badge('미확인',true)+'<span class="muted">'+r.by+' · '+r.when+'</span></div><h3 style="margin-top:14px">'+esc(r.title)+'</h3><p class="muted">'+r.status+' · 읽음 확인으로 상태가 바뀌지 않아요.</p><div class="actions"><button data-detail="'+r.id+'">내용 확인하기</button></div></section>').join(''):'<section class="card"><h3>미확인 인계가 없어요.</h3><p>읽음 확인은 차량 정상이나 점검 완료를 의미하지 않아요.</p>'+btn('기록 전체 보기','records')+'</section>')+'</div><details><summary>다른 운전자에게 전달하려면</summary><p>저장한 기록은 이 차량의 로컬 프로필에서 확인합니다. 휴대폰이나 다른 차량으로 전송되지 않습니다. 다음 운전자는 자신의 프로필로 운전 시작 후 확인합니다.</p>'+act('기록 운전자 변경','driver')+'</details>'}
function settings(){return '<h2>설정·도움말</h2><div class="layout"><section class="card"><h3>내가 보기 편하게</h3>'+act('기록 운전자 변경','driver')+'<p class="muted">실제 운전 시작 확인과 이름 관리 화면을 연결합니다.</p><label class="field">화면 테마<select id="appTheme"><option value="dark" '+(state.theme==='dark'?'selected':'')+'>다크</option><option value="light" '+(state.theme==='light'?'selected':'')+'>라이트</option></select></label><p class="muted">실제 앱은 시스템·라이트·다크 선택을 유지합니다.</p><details><summary>차량 표시·시각 설정</summary><p>동력 방식은 사용자의 화면 배치 선택이지 차량 자동 식별이 아니에요. 원본 시각과 OS 설정은 바꾸지 않아요.</p></details></section><section class="card"><h3>도움이 필요하신가요?</h3><div class="actions">'+btn('사용법 보기','help')+'</div><details><summary>AI·개인정보·동의</summary><p>선택한 종류·상황만 기존 인증된 중계로 전달합니다. 전송 전에 개인정보를 확인합니다. 동의 철회와 데이터 보존 안내를 숨기지 않습니다.</p></details><details><summary>앱 정보·기술 상세</summary><p>SDK 버전·지원 여부·오류 원문·검증 상태는 일반 홈이 아니라 이곳과 해당 오류 상세에서 확인합니다.</p></details></section></div>'}
function help(){return '<h2>세 가지만 기억해 주세요.</h2><div class="stack"><section class="card"><h3>1. 지금 확인할 내용부터 보세요.</h3><p>홈에서 이전 운전자의 미확인 내용을 엽니다.</p></section><section class="card"><h3>2. 문제가 있으면 남겨 주세요.</h3><p>문제 종류와 상황을 적고 저장합니다. AI 설명은 선택 사항입니다.</p></section><section class="card"><h3>3. 다음 운전자와 기록을 이어요.</h3><p>다음 사람은 자신의 이름으로 운전 시작 후 내용을 확인합니다. 읽음은 수리 완료가 아닙니다.</p></section></div>'}
function render(){app.className='app '+state.design+' '+state.theme+(state.font==='large'?' large':'');document.getElementById('stage').className='stage'+(state.size==='phone'?' phone':'');let restricted=['driving','unknown'].includes(state.scenario);app.innerHTML=(restricted?'<header><div class="wordmark">CARITDA<span>차량 기록을 잇다</span></div></header>':head())+(state.feedback&&!restricted?'<div class="feedback" role="status">'+esc(state.feedback)+'</div>':'')+'<div class="content">'+(restricted?'<section class="card"><p class="eyebrow">안전 제한 화면 예시</p><h2>'+(state.scenario==='unknown'?'입력 가능 상태를 확인하고 있어요.':'안전하게 주차한 뒤 이용해 주세요.')+'</h2><p>초안과 저장한 기록은 그대로 있어요.</p><p class="muted">실제 OS가 앱을 차단할 수도 있습니다. 이 시안은 운전 중 조작을 허용하는 근거가 아닙니다.</p></section>':({home,health,record:form,records:list,detail,ai,handover,settings,help}[state.page]||home)())+'</div><footer>디자인 시뮬레이션 · 가상 예시 · 실제 앱과 연결되지 않음</footer>'+(state.modal?modalHtml():'');}
function modalHtml(){let m=state.modal;if(m.kind==='cancel')return '<div class="modal"><section class="card" role="dialog" aria-modal="true" aria-label="작성 취소"><h2>작성한 내용을 버릴까요?</h2><p>문제 기록으로 저장되지 않은 내용입니다.</p><div class="actions">'+act('계속 작성','close','primary')+act('내용 버리기','discard','danger')+'</div></section></div>';if(m.kind==='driver')return '<div class="modal"><section class="card" role="dialog" aria-modal="true" aria-label="운전자 변경"><h2>누가 기록을 남기시나요?</h2><p>이 선택은 차량 시동이나 OS 계정과 무관합니다.</p><div class="actions">'+act('민수로 운전 시작','driverM','primary')+act('지연으로 운전 시작','driverJ')+act('돌아가기','close')+'</div></section></div>';if(m.kind==='draft')return '<div class="modal"><section class="card" role="dialog" aria-modal="true" aria-label="초안 보관"><h2>작성한 내용을 보관할까요?</h2><p>문제 기록으로 저장되지는 않아요.</p><div class="actions">'+act('초안 보관하고 이동','keepDraft','primary')+act('계속 작성','close')+'</div></section></div>';return '<div class="modal"><section class="card" role="dialog" aria-modal="true" aria-label="확인"><h2>'+esc(m.title)+'</h2><p>'+esc(m.text)+'</p><div class="actions">'+act('돌아가기','close','primary')+'</div></section></div>'}
app.addEventListener('input',e=>{if(e.target.id==='situation'){state.draft=e.target.value;state.saved=false}if(e.target.id==='query')state.query=e.target.value});app.addEventListener('change',e=>{if(e.target.id==='category')state.category=e.target.value;if(e.target.id==='appTheme'){state.theme=e.target.value;document.getElementById('theme').value=state.theme;render()}if(e.target.id==='query')render()});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.route){if(b.dataset.route==='record'&&state.saved){state.draft='';state.saved=false}navigate(b.dataset.route);return}if(b.dataset.detail){selected=Number(b.dataset.detail);navigate('detail');return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}const k=b.dataset.act;if(k==='back'){const target=state.history.pop()||'home';if(state.page==='record'&&state.draft&&!state.saved){state.modal={kind:'draft',to:target};render();return}state.page=target;state.feedback='';state.playing=false;render();return}if(k==='driver'){if(state.page==='record'&&state.draft&&!state.saved){state.feedback='작성 중인 초안을 보관하거나 취소해 주세요.';render();return}state.modal={kind:'driver'}}else if(k==='driverM'||k==='driverJ'){state.driver=k==='driverM'?'민수':'지연';state.modal=null;state.page='home';state.feedback='기록 운전자를 확인했어요. · 시뮬레이션'}else if(k==='close')state.modal=null;else if(k==='keepDraft'){const p=state.modal.to;state.modal=null;state.page=p;state.feedback='초안을 이 시안의 메모리에 보관했어요. 새로고침하면 사라집니다.'}else if(k==='voice'){state.draft='브레이크를 밟으면 끼익 소리가 나요.';state.saved=false;state.feedback='음성 입력 예시를 채웠어요. 실제 녹음은 하지 않았습니다.'}else if(k==='save'||k==='saveAi'){if(!state.draft.trim()){state.feedback='상황을 적어 주세요.'}else if(state.scenario==='error'){state.feedback='저장하지 못했어요. 입력은 유지됩니다. 잠시 후 다시 시도해 주세요.'}else{state.saved=true;selected=3;if(k==='saveAi')state.history.push('detail');state.page=k==='saveAi'?'ai':'detail';state.feedback='기록을 저장했어요. · 시뮬레이션'}}else if(k==='generate'){if(state.scenario==='offline'){state.feedback='연결할 수 없어요. 저장한 기록은 그대로예요.'}else{state.aiIssue=selected;state.feedback='시안용 설명을 표시했어요. 외부 모델을 호출하지 않았습니다.'}}else if(k==='listen'){state.playing=!state.playing;state.feedback=state.playing?'음성 재생 상태 예시 · 실제 재생 없음':'음성 재생 중단 상태 예시'}else if(k==='ack'){if(!state.ack.includes(selected))state.ack.push(selected);state.feedback='인계 확인을 남겼어요. 점검 상태는 바뀌지 않았어요. · 시뮬레이션'}else if(k==='clear'){state.filter='전체';state.query=''}else if(k==='cancel'){state.modal={kind:'cancel'}}else if(k==='discard'){state.draft='';state.saved=false;state.modal=null;state.page='home';state.feedback='작성 중인 내용을 버렸어요. · 시뮬레이션'}else if(k==='edit'){state.draft=(records().find(r=>r.id===selected)||{}).title||'';state.saved=false;state.page='record';state.feedback='내용 수정 배치 예시 · 실제 revision 수정 기능은 아닙니다.'}else{state.modal={kind:'info',title:k==='status'?'상태 변경은 직접 확인 후에만':k==='delete'?'삭제는 별도 확인이 필요해요.':'상세 기능 연결 위치',text:k==='status'?'기존 네 수동 상태와 점검 메모를 유지합니다. AI나 읽음 확인이 자동으로 변경하지 않습니다. 이 시안에서는 상태를 저장하지 않습니다.':k==='delete'?'실제 앱의 작성자 ID 검사·논리 삭제·이력 보존을 유지합니다. 시안은 삭제하지 않습니다.':'이 시안은 정보 구조와 배치를 보여줍니다. 실제 기능은 기존 앱 구현을 보존해 연결해야 합니다.'}}render();if(state.modal){const focus=app.querySelector('[role=dialog] button');if(focus)focus.focus()}});
app.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}if(e.key==='Tab'&&state.modal){const a=[...app.querySelectorAll('[role=dialog] button')];if(e.shiftKey&&document.activeElement===a[0]){a.at(-1).focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){a[0].focus();e.preventDefault()}}});
for(const id of ['design','size','theme','font','scenario'])document.getElementById(id).addEventListener('change',e=>{state[id]=e.target.value;if(id==='scenario')state.feedback='';state.playing=false;state.modal=null;render()});document.getElementById('reset').onclick=()=>{Object.assign(state,{page:'home',previous:'home',history:[],aiIssue:null,driver:'민수',draft:'',saved:false,ack:[],ai:false,playing:false,feedback:'',modal:null,filter:'전체',query:'',scenario:'normal'});document.getElementById('scenario').value='normal';render()};render();
</script></body></html>
